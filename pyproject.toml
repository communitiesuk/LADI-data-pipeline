[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ladi-data-pipeline"
version = "0.1.0"
description = "Pipeline for crawling, extracting, summarising and embedding UK local authority documents"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "pandas>=2.0",
    "tqdm>=4.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "aiofiles>=23.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
crawl = [
    "crawldocs @ git+https://github.com/communitiesuk/crawldocs.git",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]
db = [
    "psycopg2-binary>=2.9",
    "pgvector>=0.2",
]
all = [
    "ladi-data-pipeline[crawl,db]",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["ladi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
